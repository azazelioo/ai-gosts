[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gosts-estd"
version = "0.1.0"
description = "Local ESTD form analysis with traceable page evidence"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["dependencies"]

[project.optional-dependencies]
training = ["scikit-learn>=1.3,<2"]

[tool.setuptools]
packages = ["estd"]
package-dir = {estd = "."}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
