[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gosts-eskd"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.26,<2", "pypdf>=5.4,<7", "numpy>=1.26", "scipy>=1.11,<2", "tesserocr>=2.9,<3", "Pillow>=10"]
readme = "README.md"

[tool.setuptools]
packages = ["eskd"]
package-dir = {eskd = "."}
